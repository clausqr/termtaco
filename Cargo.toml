[package]
name = "termtaco"
version = "0.2.0"
edition = "2021"
rust-version = "1.72"
description = "A terminal tachometer: pipe a stream of numbers into a live radial speedometer gauge in your terminal (Rust TUI)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/clausqr/termtaco"
homepage = "https://github.com/clausqr/termtaco"
keywords = ["tui", "cli", "gauge", "monitoring", "ratatui"]
categories = ["command-line-utilities", "visualization"]
# Demo GIFs and recording tooling aren't needed to build or run the
# installed binary; keeps the published .crate small.
exclude = ["assets/", "record-ping-demo.sh", "*.cast", "*.zip"]

[[bin]]
name = "termtaco"
path = "src/main.rs"

[dependencies]
ratatui = "0.24"
crossterm = "0.27"
# Pinned: 1.11+ raises its MSRV above our Rust 1.72 host. Cargo 1.72's resolver
# ignores `rust-version`, so without this exact pin a `cargo update` would
# silently over-resolve to a version that fails to build. Keep `=`.
unicode-segmentation = "=1.10.1"

[profile.release]
opt-level = 2
